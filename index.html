<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SE5-Lab2: showDentistProfile() Test Harness</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body { padding: 30px; background: #f5f7fa; }
  .test-card { background: white; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  pre { background: #f4f4f4; padding: 10px; border-radius: 6px; font-size: 0.8rem; }
</style>
</head>
<body>

<div class="container">
  <h1 class="mb-4">SE5-Lab2 — <code>showDentistProfile()</code></h1>
  <p class="text-muted">Click a test case below, then click <strong>Show Profile</strong> and verify the modal matches the expected output in the README.</p>

  <div class="test-card">
    <h5>Test cases</h5>
    <button class="btn btn-outline-primary btn-sm mb-2" onclick="loadCase(0)">Case 1: Full data</button>
    <button class="btn btn-outline-primary btn-sm mb-2" onclick="loadCase(1)">Case 2: Missing optional fields</button>
    <button class="btn btn-outline-primary btn-sm mb-2" onclick="loadCase(2)">Case 3: Partial schedule</button>
    <button class="btn btn-outline-danger btn-sm mb-2" onclick="loadCase(3)">Edge: 00:00:00 times</button>
    <hr>
    <button class="btn btn-success" onclick="showDentistProfile()">
      <i class="fas fa-address-card"></i> Show Profile
    </button>
    <div id="currentCase" class="mt-2 text-muted small"></div>
  </div>

  <div class="test-card">
    <h5>Mock data currently loaded</h5>
    <pre id="dataPreview"></pre>
  </div>
</div>

<!-- Modal that showDentistProfile() populates -->
<div class="modal fade" id="dentistProfileModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rounded-4 border-0 shadow-lg">
      <div class="modal-header border-0" style="background: linear-gradient(135deg, #00695C 0%, #00897B 100%);">
        <h5 class="modal-title text-white"><i class="fas fa-user-md me-2"></i> Dentist Profile</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4" id="modalProfileContent"></div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-secondary rounded-3" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ============================================================
// Test fixtures
// ============================================================
const testCases = [
  {
    label: "Case 1: Full data",
    dentist: {
      first_name: "John", last_name: "Smith", specialization: "Orthodontics",
      license_number: "LIC123", years_of_experience: 10, education: "DMD",
      clinic_name: "Smile Clinic", clinic_address: "123 Main St", clinic_phone: "09171234567"
    },
    schedules: [
      { day_of_week: "Monday",    start_time: "09:00:00", end_time: "17:00:00", is_available: 1 },
      { day_of_week: "Tuesday",   start_time: "09:00:00", end_time: "17:00:00", is_available: 1 },
      { day_of_week: "Wednesday", start_time: "00:00:00", end_time: "00:00:00", is_available: 0 }
    ]
  },
  {
    label: "Case 2: Missing optional fields",
    dentist: {
      first_name: "Jane", last_name: "Doe", specialization: null,
      license_number: null, years_of_experience: null, education: null,
      clinic_name: null, clinic_address: null, clinic_phone: null
    },
    schedules: []
  },
  {
    label: "Case 3: Partial schedule (only Friday)",
    dentist: {
      first_name: "Bob", last_name: "Lee", specialization: "General",
      license_number: "LIC999", years_of_experience: 5, education: "DDS",
      clinic_name: "City Dental", clinic_address: "456 Oak Ave", clinic_phone: "09181112222"
    },
    schedules: [
      { day_of_week: "Friday", start_time: "10:00:00", end_time: "15:00:00", is_available: 1 }
    ]
  },
  {
    label: "EDGE: Schedule with 00:00:00 times but is_available=1",
    dentist: {
      first_name: "Edge", last_name: "Case", specialization: "General",
      license_number: "LIC000", years_of_experience: 1, education: "DDS",
      clinic_name: "Edge Clinic", clinic_address: "789 Pine Rd", clinic_phone: "09190000000"
    },
    schedules: [
      { day_of_week: "Monday", start_time: "00:00:00", end_time: "00:00:00", is_available: 1 }
    ]
  }
];

const daysOrder = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

// These two are the "globals" the original function relied on
let dentistData = testCases[0].dentist;
let schedules   = testCases[0].schedules;

// ============================================================
// Helper (unchanged by the refactor)
// ============================================================
function formatTime(time) {
  if (!time || time === '00:00:00') return '-';
  let [hour, minute] = time.split(':');
  let period = 'AM';
  let h = parseInt(hour);
  if (h >= 12) { period = 'PM'; if (h > 12) h -= 12; }
  if (h === 0) h = 12;
  return `${h}:${minute} ${period}`;
}

// ============================================================
// BASELINE showDentistProfile() — 31 lines, mixed responsibilities
// ============================================================
function showDentistProfile() {
  const d = dentistData;
  let scheduleHtml = '<table class="table table-sm table-bordered mt-2">' +
    '<thead><tr><th>Day</th><th>Hours</th></tr></thead><tbody>';
  daysOrder.forEach(day => {
    const sch = schedules.find(s => s.day_of_week === day);
    if (sch && sch.is_available == 1 && sch.start_time && sch.start_time !== '00:00:00' && sch.end_time && sch.end_time !== '00:00:00') {
      scheduleHtml += `<tr><td>${day}</td><td>${formatTime(sch.start_time)} - ${formatTime(sch.end_time)}</td></tr>`;
    } else {
      scheduleHtml += `<tr><td>${day}</td><td class="text-muted">Not available</td></tr>`;
    }
  });
  scheduleHtml += '</tbody></table>';

  const profileHtml = `
    <p><strong>Name:</strong> Dr. ${d.first_name} ${d.last_name}<br>
    <strong>Specialization:</strong> ${d.specialization || 'General Dentist'}<br>
    <strong>License:</strong> ${d.license_number || 'N/A'}<br>
    <strong>Experience:</strong> ${d.years_of_experience || 'N/A'} years<br>
    <strong>Education:</strong> ${d.education || 'N/A'}</p>
    <hr>
    <p><strong>Clinic:</strong> ${d.clinic_name || 'N/A'}<br>
    <strong>Address:</strong> ${d.clinic_address || 'N/A'}<br>
    <strong>Phone:</strong> ${d.clinic_phone || 'N/A'}</p>
    <hr>
    <h6>Weekly Schedule</h6>
    ${scheduleHtml}
  `;
  document.getElementById('modalProfileContent').innerHTML = profileHtml;
  new bootstrap.Modal(document.getElementById('dentistProfileModal')).show();
}

// ============================================================
// Test harness glue
// ============================================================
function loadCase(i) {
  dentistData = testCases[i].dentist;
  schedules   = testCases[i].schedules;
  document.getElementById('currentCase').textContent = "Loaded: " + testCases[i].label;
  document.getElementById('dataPreview').textContent =
    "dentistData = " + JSON.stringify(dentistData, null, 2) +
    "\n\nschedules = " + JSON.stringify(schedules, null, 2);
}

// Initialize
loadCase(0);
</script>
</body>
</html>
